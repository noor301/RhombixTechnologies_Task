<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Music Player</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1> Music Player</h1>
      </div>

      <div class="controls-section">
        <div class="search-section">
          <input
            type="text"
            class="search-box"
            placeholder="Search tracks, artists..."
            id="searchInput"
          />
          <div class="category-tabs">
            <button class="category-btn active" data-category="all">All</button>
            <button class="category-btn" data-category="pop">Pop</button>
            <button class="category-btn" data-category="rock">Rock</button>
            <button class="category-btn" data-category="hiphop">Hip Hop</button>
            <button class="category-btn" data-category="electronic">
              Electronic
            </button>
            <button class="category-btn" data-category="jazz">Jazz</button>
          </div>
        </div>

        <div class="player-section">
          <div class="now-playing">
            <div class="track-info">
              <h3 id="currentTrack">Select a track</h3>
              <div class="artist-info" id="currentArtist">Artist</div>
            </div>
          </div>

          <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
          </div>

          <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>

          <div class="player-controls">
            <button class="control-btn" id="prevBtn">⏮</button>
            <button class="control-btn play-btn" id="playPauseBtn">▶</button>
            <button class="control-btn" id="nextBtn">⏭</button>
          </div>

          <div class="volume-container">
            <button class="control-btn" id="volumeBtn">🔊</button>
            <input
              type="range"
              class="volume-slider"
              id="volumeSlider"
              min="0"
              max="100"
              value="50"
            />
          </div>
        </div>
      </div>

      <div class="playlist-section">
        <h2>Playlist</h2>
        <ul class="playlist" id="playlist"></ul>
      </div>
    </div>

    <audio id="audioPlayer" preload="metadata"></audio>
    <script src="app.js"></script>
  </body>
</html>
